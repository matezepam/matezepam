</style><g class="term-text" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15"><text class="terminal-type" style="--type-delay:0.20s" x="260" y="27" clip-path="url(#write-line-0)">I’m Paulo Mateo Salazar Espinoza,</text><text class="terminal-type" style="--type-delay:0.77s" x="260" y="48" clip-path="url(#write-line-1)">a software developer from Ecuador.</text><text class="terminal-type" style="--type-delay:1.34s" x="260" y="69" clip-path="url(#write-line-2)">My interests span Linux, cybersecurity, DevOps,</text><text class="terminal-type" style="--type-delay:1.91s" x="260" y="90" clip-path="url(#write-line-3)">process automation, data management and analysis,</text><text class="terminal-type" style="--type-delay:2.48s" x="260" y="111" clip-path="url(#write-line-4)">and emerging technology.</text></g></svg>
