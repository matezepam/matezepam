<svg xmlns="http://www.w3.org/2000/svg" width="300" height="34" viewBox="0 0 300 34"><title>Electronics &amp; Simulation</title><style>
@media (prefers-reduced-motion: no-preference) {
  .terminal-type { animation:terminal-type var(--typed-duration,.9s) steps(var(--typed-steps,20),end) var(--type-delay,.08s) both; }
  .terminal-rule-in { transform-origin:center;animation:terminal-line .6s ease-out both; }
}
@keyframes terminal-type { from {clip-path:inset(0 100% 0 0)} to {clip-path:inset(0)} }
@keyframes terminal-line { from {transform:scaleX(.15)} to {transform:scaleX(1)} }
.term-panel {fill:#fffafa;stroke:#d99ca5}
.term-bar {fill:#f9e9ec}
.term-rule {stroke:#d99ca5}
.term-text {fill:#8e142b}
.term-muted {fill:#932b3c}
.term-accent {fill:#a41931}
.term-accent-stroke {stroke:#a41931}
@media (prefers-color-scheme: dark) {
.term-panel {fill:#100d10;stroke:#6f2631}
.term-bar {fill:#201417}
.term-rule {stroke:#6f2631}
.term-text {fill:#ffd0d7}
.term-muted {fill:#eab3bd}
.term-accent {fill:#ff6078}
.term-accent-stroke {stroke:#ff6078}
}
</style><text x="150" y="23" text-anchor="middle" class="term-accent terminal-type" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" xml:space="preserve"><tspan class="typed-char" style="--char-delay:0.000s;--char-scroll:3.54%">E</tspan><tspan class="typed-char" style="--char-delay:0.045s;--char-scroll:7.08%">l</tspan><tspan class="typed-char" style="--char-delay:0.090s;--char-scroll:10.62%">e</tspan><tspan class="typed-char" style="--char-delay:0.135s;--char-scroll:14.17%">c</tspan><tspan class="typed-char" style="--char-delay:0.180s;--char-scroll:17.71%">t</tspan><tspan class="typed-char" style="--char-delay:0.225s;--char-scroll:21.25%">r</tspan><tspan class="typed-char" style="--char-delay:0.270s;--char-scroll:24.79%">o</tspan><tspan class="typed-char" style="--char-delay:0.315s;--char-scroll:28.33%">n</tspan><tspan class="typed-char" style="--char-delay:0.360s;--char-scroll:31.88%">i</tspan><tspan class="typed-char" style="--char-delay:0.405s;--char-scroll:35.42%">c</tspan><tspan class="typed-char" style="--char-delay:0.450s;--char-scroll:38.96%">s</tspan> <tspan class="typed-char" style="--char-delay:0.540s;--char-scroll:46.04%">&amp;</tspan> <tspan class="typed-char" style="--char-delay:0.630s;--char-scroll:53.12%">S</tspan><tspan class="typed-char" style="--char-delay:0.675s;--char-scroll:56.67%">i</tspan><tspan class="typed-char" style="--char-delay:0.720s;--char-scroll:60.21%">m</tspan><tspan class="typed-char" style="--char-delay:0.765s;--char-scroll:63.75%">u</tspan><tspan class="typed-char" style="--char-delay:0.810s;--char-scroll:67.29%">l</tspan><tspan class="typed-char" style="--char-delay:0.855s;--char-scroll:70.83%">a</tspan><tspan class="typed-char" style="--char-delay:0.900s;--char-scroll:74.38%">t</tspan><tspan class="typed-char" style="--char-delay:0.945s;--char-scroll:77.92%">i</tspan><tspan class="typed-char" style="--char-delay:0.990s;--char-scroll:81.46%">o</tspan><tspan class="typed-char" style="--char-delay:1.035s;--char-scroll:85.00%">n</tspan></text><style>
@media (prefers-reduced-motion: no-preference) {
  .terminal-type,.copy-line,.metric,.typed {animation:none!important}
  .typed-char {animation:character-visible .045s step-end calc(var(--type-delay,var(--delay,.08s)) + var(--char-delay)) both}
}
