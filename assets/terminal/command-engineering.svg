<svg xmlns="http://www.w3.org/2000/svg" width="157" height="34" viewBox="0 0 157 34"><title>Engineering</title><style>
@media (prefers-reduced-motion: no-preference) {
  .terminal-type { animation:terminal-type var(--typed-duration,.9s) steps(var(--typed-steps,20),end) var(--type-delay,.08s) both; }
  .terminal-rule-in { transform-origin:center;animation:terminal-line .6s ease-out both; }
}
@keyframes terminal-type { from {clip-path:inset(0 100% 0 0)} to {clip-path:inset(0)} }
@keyframes terminal-line { from {transform:scaleX(.15)} to {transform:scaleX(1)} }
.term-panel {fill:#fffafa;stroke:#d99ca5}
.term-bar {fill:#f9e9ec}
.term-rule {stroke:#d99ca5}
.term-text {fill:#8e142b}
.term-muted {fill:#932b3c}
.term-accent {fill:#a41931}
.term-accent-stroke {stroke:#a41931}
@media (prefers-color-scheme: dark) {
.term-panel {fill:#100d10;stroke:#6f2631}
.term-bar {fill:#201417}
.term-rule {stroke:#6f2631}
.term-text {fill:#ffd0d7}
.term-muted {fill:#eab3bd}
.term-accent {fill:#ff6078}
.term-accent-stroke {stroke:#ff6078}
}
